name: Reportar un error
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué ocurre?
      description: Describe el problema con tus palabras.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a ...
        2. Hacer clic en ...
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué debería ocurrir?
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Información adicional
      description: Capturas de pantalla, fecha y hora aproximada, navegador o equipo usado.
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      options:
        - Bloquea el trabajo
        - Molesto, pero hay alternativa
        - Menor
    validations:
      required: true
